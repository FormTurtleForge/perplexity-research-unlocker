<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="120" fill="none" stroke="#58a6ff" stroke-opacity="0.06" stroke-width="1"/>
  <circle cx="1100" cy="300" r="150" fill="none" stroke="#1f6feb" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="200" cy="280" r="60" fill="none" stroke="#58a6ff" stroke-opacity="0.04" stroke-width="0.5"/>
  <circle cx="950" cy="60" r="80" fill="none" stroke="#1f6feb" stroke-opacity="0.05" stroke-width="0.5"/>

  <!-- Decorative lines -->
  <line x1="0" y1="180" x2="1200" y2="180" stroke="url(#line)" stroke-width="0.5"/>

  <!-- Decorative path -->
  <path d="M0 320 Q300 280 600 310 T1200 300" fill="none" stroke="#58a6ff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M0 40 Q400 70 700 30 T1200 50" fill="none" stroke="#1f6feb" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Small decorative dots -->
  <circle cx="120" cy="140" r="1.5" fill="#58a6ff" fill-opacity="0.2"/>
  <circle cx="1080" cy="220" r="1.5" fill="#58a6ff" fill-opacity="0.2"/>
  <circle cx="250" cy="100" r="1" fill="#58a6ff" fill-opacity="0.15"/>
  <circle cx="900" cy="150" r="1" fill="#58a6ff" fill-opacity="0.15"/>
  <circle cx="700" cy="260" r="1.5" fill="#58a6ff" fill-opacity="0.1"/>
  <circle cx="480" cy="120" r="1" fill="#58a6ff" fill-opacity="0.12"/>
  <circle cx="350" cy="250" r="1" fill="#58a6ff" fill-opacity="0.1"/>
  <circle cx="1050" cy="120" r="1.5" fill="#58a6ff" fill-opacity="0.12"/>

  <!-- Headline -->
  <text x="600" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52.0" font-weight="bold" fill="#ffffff">
    <tspan x="600" dy="0">Perplexity Pro 2026</tspan>
    <tspan x="600" dy="62">Research Unlocker</tspan>
  </text>

  <!-- Divider line under headline -->
  <line x1="420" y1="230" x2="780" y2="230" stroke="#58a6ff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Tagline -->
  <text x="600" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Monitor research depth for Perplexity Pro 2026 subscribers —</tspan>
    <tspan x="600" dy="30">track query limits and organize saved threads.</tspan>
  </text>
</svg>